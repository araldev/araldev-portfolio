<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
  <!--
    card-organic.svg — N1 ProjectsCards v3 decorative mask (OQ-N1-01 HYBRID).

    Used as a CSS `mask-image` on `.project_card::before` (a small
    decorative element in the top-right corner of each card). The mask
    is a 5-vertex polygon that "cuts" a diagonal from the top-right
    corner (15% inset) to the bottom (20% inset), producing the
    "refraction" visual metaphor from design.md §N1.1 (lente
    refractiva) without using absolute clip-path coordinates.

    The viewBox is 0 0 100 100 so the SVG is fully proportional
    (`preserveAspectRatio="none"` is set so the mask stretches to
    cover any decorative element size without deformation).

    Used as:
      mask-image: url("/masks/card-organic.svg");
      mask-size: cover;
      mask-position: top right;
  -->
  <path d="M 0 0 L 100 0 L 100 85 L 80 100 L 0 100 Z" fill="white"/>
</svg>
